<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Moyennes - Semestres 5 et 6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #status {
            text-align: center;
            font-size: 0.875rem;
            color: #888;
            margin-bottom: 30px;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        #status.success {
            color: #00ff00;
        }

        .semester {
            background: #111;
            border: 1px solid #333;
            border-radius: 16px;
            padding: clamp(20px, 4vw, 35px);
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .semester:hover {
            border-color: #555;
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.05);
        }

        h2 {
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: -0.01em;
            padding-bottom: 15px;
            border-bottom: 2px solid #222;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -10px;
            padding: 0 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 600px;
        }

        th, td {
            padding: clamp(10px, 2vw, 16px);
            text-align: left;
            border-bottom: 1px solid #222;
        }

        th {
            background: #1a1a1a;
            color: #fff;
            font-weight: 600;
            font-size: clamp(0.75rem, 2vw, 0.875rem);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #0a0a0a;
        }

        td {
            font-size: clamp(0.875rem, 2vw, 1rem);
        }

        td:first-child {
            font-weight: 500;
        }

        input {
            width: 100%;
            max-width: 80px;
            padding: 8px 12px;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        input:focus {
            outline: none;
            border-color: #666;
            background: #0a0a0a;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .module-grade {
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 60px;
            font-family: 'Courier New', monospace;
        }

        .avg-good {
            color: #00ff00;
        }

        .avg-bad {
            color: #ff0000;
        }

        .na {
            color: #555;
            font-style: italic;
            font-size: 0.875rem;
        }

        .results {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid #333;
            border-radius: 16px;
            padding: clamp(25px, 4vw, 40px);
            margin-top: 40px;
        }

        .results h2 {
            font-size: clamp(1.5rem, 3vw, 2rem);
            text-align: center;
            margin-bottom: 30px;
            border: none;
        }

        .results h3 {
            font-size: clamp(1.1rem, 2.5vw, 1.35rem);
            margin: 25px 0 15px 0;
            font-weight: 600;
        }

        .module-details {
            margin-bottom: 30px;
        }

        .module-details table {
            min-width: 100%;
            background: #0a0a0a;
            border-radius: 12px;
            overflow: hidden;
        }

        .module-details th {
            background: #000;
            border-bottom: 2px solid #333;
        }

        .module-details td {
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }

        .module-details tr:last-child td {
            border-bottom: none;
        }

        .yearly-avg {
            text-align: center;
            padding: 30px;
            margin-top: 30px;
            background: #000;
            border-radius: 12px;
            border: 2px solid #333;
        }

        .yearly-avg h3 {
            font-size: clamp(1.25rem, 3vw, 1.75rem);
            margin: 0;
        }

        .yearly-avg .score {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }

        button#clear {
            background: #000;
            color: #fff;
            border: 2px solid #ff0000;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button#clear:hover {
            background: #ff0000;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 0, 0, 0.3);
        }

        button#clear:active {
            transform: translateY(0);
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .semester {
                padding: 20px 15px;
                margin-bottom: 20px;
            }

            table {
                min-width: 550px;
                font-size: 0.875rem;
            }

            th, td {
                padding: 10px 8px;
            }

            input {
                max-width: 70px;
                padding: 6px 8px;
                font-size: 0.9rem;
            }

            .results {
                padding: 20px 15px;
            }

            .table-wrapper {
                margin: 0 -15px;
                padding: 0 15px;
            }

            /* Scrollbar styling for mobile */
            .table-wrapper::-webkit-scrollbar {
                height: 8px;
            }

            .table-wrapper::-webkit-scrollbar-track {
                background: #111;
                border-radius: 4px;
            }

            .table-wrapper::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 4px;
            }

            .table-wrapper::-webkit-scrollbar-thumb:hover {
                background: #555;
            }
        }

        @media (max-width: 480px) {
            table {
                min-width: 500px;
            }

            th, td {
                padding: 8px 6px;
                font-size: 0.8rem;
            }

            input {
                max-width: 60px;
                padding: 5px 6px;
                font-size: 0.85rem;
            }

            .module-grade {
                font-size: 0.95rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .semester {
            animation: fadeIn 0.5s ease forwards;
        }

        .semester:nth-child(2) {
            animation-delay: 0.1s;
        }

        .semester:nth-child(3) {
            animation-delay: 0.2s;
        }

        /* Loading state */
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculateur de Moyennes</h1>
        <div id="status">Chargement des notes précédentes...</div>
        
        <div class="semester" id="sem5">
            <h2>Semestre 5</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Module</th>
                            <th>Coeff</th>
                            <th>Continu</th>
                            <th>Examen</th>
                            <th>Note</th>
                        </tr>
                    </thead>
                    <tbody id="sem5-body"></tbody>
                </table>
            </div>
        </div>
        
        <div class="semester" id="sem6">
            <h2>Semestre 6</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Module</th>
                            <th>Coeff</th>
                            <th>Continu</th>
                            <th>Examen</th>
                            <th>Note</th>
                        </tr>
                    </thead>
                    <tbody id="sem6-body"></tbody>
                </table>
            </div>
        </div>

        <button id="clear">Effacer toutes les notes</button>
        
        <div class="results" id="results"></div>
    </div>

    <script>
        const STORAGE_KEY = 'notes_sem5_sem6_2025';

        const sem5Modules = [
            {name: "Architecture et Administration des BDD", coeff: 4, continu: 40, examen: 60},
            {name: "Compilation", coeff: 4, continu: 40, examen: 60},
            {name: "Programmation Linéaire et Dynamique", coeff: 3, continu: 40, examen: 60},
            {name: "Analyse numérique 1", coeff: 2, continu: 40, examen: 60},
            {name: "Génie logiciel", coeff: 2, continu: 40, examen: 60},
            {name: "Fondements de l'IA", coeff: 3, continu: 40, examen: 60},
            {name: "Interface Homme Machine", coeff: 2, continu: 40, examen: 60}
        ];

        const sem6Modules = [
            {name: "Gestion des bases de données réparties", coeff: 3, continu: 40, examen: 60},
            {name: "Système d'Exploitation : Synchronisation et Communication", coeff: 4, continu: 40, examen: 60},
            {name: "Gestion de Projets", coeff: 4, continu: 40, examen: 60},
            {name: "Programmation WEB", coeff: 3, continu: 40, examen: 60},
            {name: "Analyse numérique 2", coeff: 2, continu: 40, examen: 60},
            {name: "Introduction à la sécurité Informatique", coeff: 2, continu: 40, examen: 60},
            {name: "Introduction à l'IA", coeff: 2, continu: 0, examen: 100},
            {name: "Ethique de l'IA", coeff: 2, continu: 0, examen: 100}
        ];

        function createRow(mod, semId, index) {
            return `
                <tr>
                    <td>${mod.name}</td>
                    <td>${mod.coeff}</td>
                    <td>${mod.continu > 0 ? `<input type="number" class="input-note" data-sem="${semId}" data-index="${index}" data-type="cc" min="0" max="20" step="0.01">` : '<span class="na">N/A</span>'}</td>
                    <td>${mod.examen > 0 ? `<input type="number" class="input-note" data-sem="${semId}" data-index="${index}" data-type="ex" min="0" max="20" step="0.01">` : '<span class="na">N/A</span>'}</td>
                    <td id="${semId}_mod_${index}" class="module-grade"></td>
                </tr>
            `;
        }

        function populateTables() {
            document.getElementById('sem5-body').innerHTML = sem5Modules.map((mod, i) => createRow(mod, 'sem5', i)).join('');
            document.getElementById('sem6-body').innerHTML = sem6Modules.map((mod, i) => createRow(mod, 'sem6', i)).join('');

            loadSavedNotes();

            document.querySelectorAll('.input-note').forEach(input => {
                input.addEventListener('input', debounce(saveAndCalculate, 500));
            });
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function getAllNotes() {
            const notes = {};
            document.querySelectorAll('.input-note').forEach(input => {
                if (input.value !== '') {
                    const key = `${input.dataset.sem}-${input.dataset.index}-${input.dataset.type}`;
                    notes[key] = input.value;
                }
            });
            return notes;
        }

        function saveAndCalculate() {
            const notes = getAllNotes();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Notes sauvegardées ✓';
            statusEl.classList.add('success');
            setTimeout(() => {
                statusEl.textContent = '';
                statusEl.classList.remove('success');
            }, 2000);
            calculateAverages();
        }

        function loadSavedNotes() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                document.getElementById('status').textContent = 'Aucune note sauvegardée précédemment';
                calculateAverages();
                return;
            }

            const notes = JSON.parse(saved);
            Object.keys(notes).forEach(key => {
                const [sem, index, type] = key.split('-');
                const input = document.querySelector(`.input-note[data-sem="${sem}"][data-index="${index}"][data-type="${type}"]`);
                if (input) {
                    input.value = notes[key];
                }
            });

            document.getElementById('status').textContent = 'Notes précédentes chargées';
            calculateAverages();
        }

        document.getElementById('clear').addEventListener('click', () => {
            if (confirm('Vraiment effacer TOUTES les notes sauvegardées ?')) {
                localStorage.removeItem(STORAGE_KEY);
                document.querySelectorAll('.input-note').forEach(i => i.value = '');
                document.getElementById('status').textContent = 'Toutes les notes ont été effacées';
                calculateAverages();
            }
        });

        function calculateSemester(modules, semId) {
            let totalWeighted = 0;
            let totalCoeff = 0;
            let details = [];

            modules.forEach((mod, index) => {
                const ccEl = document.querySelector(`.input-note[data-sem="${semId}"][data-index="${index}"][data-type="cc"]`);
                const exEl = document.querySelector(`.input-note[data-sem="${semId}"][data-index="${index}"][data-type="ex"]`);
                
                const cc = ccEl ? parseFloat(ccEl.value) || 0 : 0;
                const ex = exEl ? parseFloat(exEl.value) || 0 : 0;
                
                const grade = (cc * (mod.continu / 100)) + (ex * (mod.examen / 100));
                
                const gradeCell = document.getElementById(`${semId}_mod_${index}`);
                if ((ccEl && ccEl.value !== '') || (exEl && exEl.value !== '')) {
                    gradeCell.textContent = grade.toFixed(2);
                    gradeCell.className = 'module-grade ' + (grade >= 10 ? 'avg-good' : 'avg-bad');
                } else {
                    gradeCell.textContent = '';
                    gradeCell.className = 'module-grade';
                }

                totalWeighted += grade * mod.coeff;
                totalCoeff += mod.coeff;
                details.push({name: mod.name, grade: grade.toFixed(2), passed: grade >= 10});
            });

            const avg = totalCoeff > 0 ? (totalWeighted / totalCoeff).toFixed(2) : '0.00';
            return {avg, details, totalCoeff};
        }

        function getAvgClass(avg) {
            return parseFloat(avg) >= 10 ? 'avg-good' : 'avg-bad';
        }

        function calculateAverages() {
            const sem5 = calculateSemester(sem5Modules, 'sem5');
            const sem6 = calculateSemester(sem6Modules, 'sem6');

            const yearAvg = ((parseFloat(sem5.avg) + parseFloat(sem6.avg)) / 2).toFixed(2);

            let html = `
                <h2>Résultats</h2>
                
                <h3>Semestre 5 - Moyenne : <span class="${getAvgClass(sem5.avg)}">${sem5.avg} / 20</span></h3>
                <div class="module-details">
                    <div class="table-wrapper">
                        <table>
                            <tr><th>Module</th><th>Note</th></tr>
                            ${sem5.details.map(d => `<tr><td>${d.name}</td><td class="${d.passed ? 'avg-good' : 'avg-bad'}">${d.grade}</td></tr>`).join('')}
                        </table>
                    </div>
                </div>

                <h3>Semestre 6 - Moyenne : <span class="${getAvgClass(sem6.avg)}">${sem6.avg} / 20</span></h3>
                <div class="module-details">
                    <div class="table-wrapper">
                        <table>
                            <tr><th>Module</th><th>Note</th></tr>
                            ${sem6.details.map(d => `<tr><td>${d.name}</td><td class="${d.passed ? 'avg-good' : 'avg-bad'}">${d.grade}</td></tr>`).join('')}
                        </table>
                    </div>
                </div>

                <div class="yearly-avg">
                    <h3>Moyenne Annuelle</h3>
                    <div class="score ${getAvgClass(yearAvg)}">${yearAvg} / 20</div>
                </div>
            `;

            document.getElementById('results').innerHTML = html;
        }

        populateTables();
    </script>
</body>
</html>
